{% load static%}

<html lang="en">
<head>

    <title>Tweet App</title>
    <link rel="stylesheet" href="{% static 'TwitApp/customform.css' %}">

<body>

                <a class="nav-link" aria-current="page" href="{%url 'TwitApp:signup'%}">Register</a>

                <li class="nav-item">

                </li>-->
